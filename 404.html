/* SurajAN_95 signature watermark — premium glass + animated spectral glow */
.sa-signature{
 position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));
 z-index:9999;display:inline-flex;align-items:center;gap:8px;
 max-width:calc(100vw - 24px);padding:9px 13px;border-radius:999px;
 border:1px solid rgba(170,196,255,.34);
 background:linear-gradient(135deg,rgba(13,19,33,.91),rgba(23,20,48,.88));
 -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
 color:#f7f9ff;text-decoration:none;font:800 10px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 letter-spacing:.16em;text-transform:uppercase;box-shadow:0 0 0 1px rgba(255,255,255,.035),0 5px 24px rgba(0,0,0,.32),0 0 22px rgba(83,151,255,.16);
 isolation:isolate;overflow:hidden;animation:sa-float-glow 4.5s ease-in-out infinite;
}
.sa-signature::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;padding:1px;background:linear-gradient(115deg,#eaf5ff,#7ab7ff,#b49aff,#f1f5ff,#63e4ff);background-size:260% 260%;animation:sa-spectrum 6s linear infinite;opacity:.9; -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.sa-signature::after{content:"";position:absolute;top:-60%;left:-45%;width:35%;height:220%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:sa-sheen 5.8s ease-in-out infinite;pointer-events:none}
.sa-signature .sa-dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:linear-gradient(135deg,#dff7ff,#7ab7ff 55%,#c1a0ff);box-shadow:0 0 8px #76b8ff,0 0 14px #a58cff}
.sa-signature .sa-name{background:linear-gradient(100deg,#fff 0%,#bde4ff 30%,#c7b5ff 63%,#fff 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sa-spectrum 5s linear infinite;white-space:nowrap}
@keyframes sa-spectrum{0%{background-position:0% 50%}100%{background-position:260% 50%}}
@keyframes sa-sheen{0%,58%{left:-45%;opacity:0}68%{opacity:.9}86%,100%{left:130%;opacity:0}}
@keyframes sa-float-glow{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.035),0 5px 24px rgba(0,0,0,.32),0 0 18px rgba(83,151,255,.13)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 5px 26px rgba(0,0,0,.34),0 0 25px rgba(139,119,255,.24)}}
@media(max-width:480px){.sa-signature{right:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:8px 11px;font-size:9px;letter-spacing:.13em}}
@media(prefers-reduced-motion:reduce){.sa-signature,.sa-signature::before,.sa-signature::after,.sa-signature .sa-name{animation:none!important}}

/* Multicolour signature lettering: each character gets its own jewel tone */
.sa-signature .sa-name{
 display:inline-flex;align-items:center;white-space:nowrap;
 background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;
 color:#fff;animation:none!important;
}
.sa-signature .sa-name .sa-char{
 display:inline-block;
 background:linear-gradient(180deg,var(--sa-top),var(--sa-bottom));
 -webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-fill-color:transparent;
 text-shadow:0 0 8px var(--sa-glow);
 animation:sa-letter-shimmer 3.8s ease-in-out infinite;
 animation-delay:var(--sa-delay);
}
.sa-signature .sa-name .sa-gap{width:.34em}
@keyframes sa-letter-shimmer{
 0%,100%{filter:brightness(1) drop-shadow(0 0 1px var(--sa-glow));}
 50%{filter:brightness(1.45) drop-shadow(0 0 5px var(--sa-glow));}
}
@media(prefers-reduced-motion:reduce){.sa-signature .sa-name .sa-char{animation:none!important}}
