<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurajAN_95 | Premium PDF Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Clean Apple-like Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navigation -->
    <header class="header">
        <div class="logo">⚡ SurajAN Store</div>
        <div class="tagline">MrBeast Level Education Hub</div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Zero se Hero, <span class="highlight">Direct Success!</span></h1>
        <p>Class 0 से लेकर UPSC, NDA और GK के सबसे तगड़े प्रीमियम नोट्स और टिक-मार्किंग टेस्ट पेपर्स।</p>
    </section>

    <!-- Categories Filter -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterCategory('all')">All Products</button>
        <button class="filter-btn" onclick="filterCategory('upsc')">UPSC / Pro</button>
        <button class="filter-btn" onclick="filterCategory('gk')">GK & Quiz</button>
        <button class="filter-btn" onclick="filterCategory('school')">School & Kids</button>
    </div>

    <!-- Products Grid -->
    <div class="product-grid" id="productGrid">
        <!-- Products will be dynamically loaded via script.js -->
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SurajAN_95 Enterprise. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
      </html>
