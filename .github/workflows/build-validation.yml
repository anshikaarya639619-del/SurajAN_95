name: EVERYTHING WORLD — Build Validation

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "*.css"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/**"
      - ".github/workflows/build-validation.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/**"
  workflow_dispatch:
  schedule:
    # Daily repository validation at 04:35 UTC (10:05 IST); may be delayed by GitHub.
    - cron: "35 4 * * *"

permissions:
  contents: read

concurrency:
  group: build-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate HTML metadata, local links, stylesheets and sitemap
        run: python3 scripts/validate_site.py
