name: SurajAN_95 Auto Sync Empire

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Empire Generator Engine
        run: |
          echo "🚀 Running SurajAN_95 Generator..."
          python generator.py

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'SurajAN_95 Bot'
          git config --global user.email 'bot@surajan95.com'
          git add .
          git commit -m "🤖 Automated Daily Empire Sync by SurajAN_95 Bot" || echo "No changes to commit"
          git push
