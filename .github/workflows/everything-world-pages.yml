name: EVERYTHING WORLD — Validate and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate site and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files and HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = ["index.html", "dashboard.html", "education.html", "technology.html", "tools.html", "404.html", "stark-ui.css"]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))
          for p in Path(".").glob("*.html"):
              s = p.read_text(encoding="utf-8")
              if "<html" not in s.lower() or "</html>" not in s.lower():
                  raise SystemExit(f"Invalid HTML document structure: {p}")
          print("Required files and HTML structure passed.")
          PY

      - name: Check local HTML references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          root = Path(".").resolve()
          errors = []
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  self.refs += [a[k].strip() for k in ("href", "src") if a.get(k, "").strip()]
          for page in Path(".").glob("*.html"):
              parser = Parser()
              parser.feed(page.read_text(encoding="utf-8"))
              for ref in parser.refs:
                  if ref.startswith(("#", "mailto:", "tel:", "javascript:", "data:")):
                      continue
                  u = urlparse(ref)
                  if u.scheme or u.netloc:
                      continue
                  target = (page.parent / unquote(u.path)).resolve() if u.path else page.resolve()
                  if not str(target).startswith(str(root)) or (u.path and not target.exists()):
                      errors.append(f"{page}: {ref}")
          if errors:
              print("\n".join(errors))
              raise SystemExit(f"Found {len(errors)} broken local references.")
          print("Local HTML references passed.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
