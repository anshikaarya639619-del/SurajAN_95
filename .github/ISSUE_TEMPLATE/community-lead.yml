name: स्थानीय कहानी / कारोबार का सुझाव
description: गोरखपुर की कहानी, स्थानीय कारोबार या सहयोग का सुझाव भेजें।
title: "[COMMUNITY LEAD] "
labels: [community-lead]
body:
  - type: markdown
    attributes:
      value: |
        **गोपनीयता सूचना:** यह सुझाव GitHub पर एक PUBLIC issue के रूप में दिखाई देगा और कोई भी इसे देख सकता है। फोन नंबर, निजी ईमेल, घर का पता, पासवर्ड, भुगतान विवरण या संवेदनशील निजी जानकारी न लिखें। केवल वही जानकारी भेजें जिसे सार्वजनिक रूप से साझा करना सुरक्षित हो। GitHub खाते से साइन इन करना आवश्यक है।
  - type: dropdown
    id: request_type
    attributes:
      label: आप किसलिए सुझाव भेज रहे हैं?
      options:
        - मैं अपने स्थानीय कारोबार की पहचान बढ़ाना चाहता/चाहती हूँ
        - मैं कारोबार के प्रचार पर बात करना चाहता/चाहती हूँ
        - मैं किसी हुनरमंद व्यक्ति / क्रिएटर का सुझाव देना चाहता/चाहती हूँ
        - मैं किसी जगह / गाँव / कार्यक्रम का सुझाव देना चाहता/चाहती हूँ
        - मैं GORAKHPUR 365 के साथ काम करना चाहता/चाहती हूँ
        - मेरे पास गोरखपुर से जुड़ा सामान्य सुझाव है
    validations:
      required: true
  - type: input
    id: public_name
    attributes:
      label: सार्वजनिक नाम या कारोबार का नाम
      description: केवल वही नाम लिखें जिसे सार्वजनिक रूप से दिखाने में आपको आपत्ति न हो।
      placeholder: कारोबार / क्रिएटर / जगह का नाम
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: गोरखपुर का इलाका / मोहल्ला / गाँव
      placeholder: मोहल्ले या गाँव का नाम
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: श्रेणी
      options:
        - खाना / रेस्टोरेंट / कैफ़े
        - दुकान / रिटेल
        - सेवा / पेशेवर काम
        - कलाकार / क्रिएटर / हुनर
        - खेल / फिटनेस
        - शिक्षा
        - घूमने की जगह / कार्यक्रम
        - अन्य
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: आप लोगों को क्या दिखाना चाहते हैं?
      description: केवल सार्वजनिक जानकारी दें। निजी संपर्क जानकारी न लिखें।
      placeholder: यह कारोबार, व्यक्ति, जगह या विचार क्यों जानने योग्य है?
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: सहमति
      options:
        - label: मैं समझता/समझती हूँ कि यह सुझाव GitHub पर सार्वजनिक रूप से दिखाई देगा और मैं इन जानकारियों को सार्वजनिक रूप से साझा करने की सहमति देता/देती हूँ।
          required: true
